          id:
            type: string
            minLength: 1
            maxLength: 20000
          kind:
            type: string
            minLength: 1
            maxLength: 20000
          version:
            type: integer
            minimum: 1
            maximum: 1000000
          created_at: &id001
            type: string
            minLength: 1
            maxLength: 20000
          updated_at: *id001
          archived: &id002
            type: boolean
          fields:
            type: object
            properties: {}
            required: []
            additionalProperties: true
        required:
        - id
        - kind
        - version
        - created_at
        - updated_at
        - archived
        - fields
        additionalProperties: false
      changed: *id002
      operation_status:
        type: string
        enum:
        - committed
      result_state:
        type: string
        enum:
        - available
        - expired
      original_request_id:
        type: string
        minLength: 1
        maxLength: 20000
      code:
        type: string
        enum:
        - result_expired
    required:
    - operation_status
    - result_state
    additionalProperties: false
  dependencies: []
  permissions:
