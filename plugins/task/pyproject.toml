[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yushuos-task"
version = "0.2.0"
description = "YushuOS Task domain plugin and reference implementation"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = ["yushuos-core>=0.3.1,<0.4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6.0,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
