  - '{plugin_root}/run.py'
  timeout_seconds: 30
  protocol: json-stdio-v2
capabilities:
- name: finance.statement.create
  effect: internal_write
  inputs:
    type: object
    properties:
      month: &id008
        type: string
        minLength: 1
        maxLength: 20000
      currency: &id009
        type: string
        minLength: 1
        maxLength: 20000
      source_id: &id010
        type: string
        minLength: 1
        maxLength: 20000
      transactions:
        type: array
        items:
          type: object
          properties:
            amount:
              type: string
              minLength: 1
              maxLength: 20000
            direction:
              type: string
              enum:
              - income
              - expense
            category:
              type: string
              minLength: 1
              maxLength: 20000
            at:
              type: string
              minLength: 1
              maxLength: 20000
            external_id:
              type: string
              minLength: 1
              maxLength: 20000
          required:
          - amount
          - direction
          additionalProperties: false
        minItems: 0
        maxItems: 1000
    required:
    - month
    - currency
    - source_id
    - transactions
    additionalProperties: false
  outputs:
    type: object
    properties:
      entity:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 20000
          kind:
            type: string
            minLength: 1
            maxLength: 20000
          version:
            type: integer
            minimum: 1
            maximum: 1000000
          created_at: &id001
            type: string
            minLength: 1
            maxLength: 20000
          updated_at: *id001
          archived: &id002
            type: boolean
          fields:
            type: object
            properties: {}
            required: []
            additionalProperties: true
        required:
        - id
        - kind
        - version
        - created_at
        - updated_at
        - archived
        - fields
        additionalProperties: false
      changed: *id002
      operation_status:
        type: string
        enum:
        - committed
      result_state:
        type: string
        enum:
        - available
        - expired
      original_request_id:
        type: string
        minLength: 1
        maxLength: 20000
      code:
        type: string
        enum:
        - result_expired
    required:
    - operation_status
    - result_state
    additionalProperties: false
  dependencies: []
  permissions:
  - finance.write
  intents:
  - command
  implemented: true
  verified: true
  authorized: true
  enabled: true
  execution_mode: standalone
  description: finance.statement.create
  resource_scopes:
    store_id: finance_store
