id: yushuos.planner
name: YushuOS planner
version: 0.1.0
contract_version: 3
operation_support: local_commit_v1
type: domain
description: Independent local-first planner domain plugin
enabled: true
dependencies: []
optional_dependencies: []
permissions: []
data_path: data
supported_runtimes:
- python>=3.11
configuration:
  type: object
  properties: {}
  required: []
  additionalProperties: false
error_policy: fail_closed
audit_policy: metadata_only
runner:
  command:
  - '{python}'
  - '{plugin_root}/run.py'
  timeout_seconds: 30
  protocol: json-stdio-v2
capabilities:
- name: planner.plan.create
  effect: internal_write
  inputs:
    type: object
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 20000
      tasks: &id012
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 20000
            version: &id006
              type: integer
              minimum: 1
              maximum: 1000000
            priority:
              type: string
              enum:
              - urgent
              - high
              - normal
              - low
            estimate_minutes:
              type: integer
              minimum: 1
              maximum: 10080
            due_at: &id001
              type: string
              minLength: 1
              maxLength: 20000
            earliest_start: *id001
          required:
          - id
          - version
          - estimate_minutes
          additionalProperties: false
        minItems: 0
        maxItems: 1000
      windows: &id013
        type: array
        items:
          type: object
          properties:
            start: *id001
            end: *id001
          required:
          - start
          - end
          additionalProperties: false
        minItems: 0
        maxItems: 1000
      energy_budget_minutes: &id014
        type: integer
        minimum: 0
        maximum: 10080
    required:
    - title
    - tasks
    - windows
    additionalProperties: false
  outputs:
    type: object
    properties:
      entity:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 20000
          kind:
            type: string
            minLength: 1
            maxLength: 20000
          version:
            type: integer
            minimum: 1
            maximum: 1000000
          created_at: &id002
            type: string
            minLength: 1
            maxLength: 20000
          updated_at: *id002
          archived: &id003
            type: boolean
          fields:
            type: object
            properties: {}
            required: []
            additionalProperties: true
        required:
        - id
        - kind
        - version
        - created_at
        - updated_at
        - archived
        - fields
        additionalProperties: false
      changed: *id003
      operation_status:
        type: string
        enum:
        - committed
      result_state:
        type: string
        enum:
        - available
        - expired
      original_request_id:
        type: string
        minLength: 1
        maxLength: 20000
      code:
        type: string
        enum:
        - result_expired
    required:
    - operation_status
    - result_state
    additionalProperties: false
  dependencies: []
  permissions:
  - planner.write
  intents:
  - command
  implemented: true
  verified: true
  authorized: true
  enabled: true
  execution_mode: standalone
  description: planner.plan.create
  resource_scopes:
    store_id: planner_store
