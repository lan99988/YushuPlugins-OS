- name: cognition.pattern.create
  effect: internal_write
  inputs:
    type: object
    properties: &id006
      statement:
        type: string
        minLength: 1
        maxLength: 20000
      evidence_refs: &id001
        type: array
        items:
          type: object
          properties:
            provider:
              type: string
              minLength: 1
              maxLength: 20000
            kind:
              type: string
              minLength: 1
              maxLength: 20000
            id:
              type: string
              minLength: 1
              maxLength: 20000
            store_id:
              type: string
              minLength: 1
              maxLength: 20000
          required:
          - provider
          - kind
          - id
          - store_id
          additionalProperties: false
        minItems: 0
        maxItems: 1000
      counterevidence_refs: *id001
      source:
        type: string
        minLength: 1
        maxLength: 20000
    required:
    - statement
    - source
    additionalProperties: false
  outputs:
    type: object
    properties:
      entity:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 20000
          kind:
            type: string
            minLength: 1
            maxLength: 20000
          version:
            type: integer
            minimum: 1
            maximum: 1000000
          created_at: &id002
            type: string
            minLength: 1
            maxLength: 20000
          updated_at: *id002
          archived: &id003
            type: boolean
          fields:
            type: object
            properties: {}
            required: []
            additionalProperties: true
        required:
        - id
        - kind
        - version
        - created_at
        - updated_at
        - archived
        - fields
        additionalProperties: false
      changed: *id003
      operation_status:
        type: string
        enum:
        - committed
      result_state:
        type: string
        enum:
        - available
        - expired
      original_request_id:
        type: string
        minLength: 1
        maxLength: 20000
      code:
        type: string
        enum:
        - result_expired
    required:
    - operation_status
    - result_state
    additionalProperties: false
  dependencies: []
  permissions:
  - cognition.write
  intents:
  - command
  implemented: true
  verified: true
  authorized: true
  enabled: true
  execution_mode: standalone
  description: cognition.pattern.create
  resource_scopes:
    store_id: cognition_store
