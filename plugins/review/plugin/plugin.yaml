id: yushuos.review
name: YushuOS review
version: 0.1.0
contract_version: 3
operation_support: local_commit_v1
type: domain
description: Independent local-first review domain plugin
enabled: true
dependencies: []
optional_dependencies: []
permissions: []
data_path: data
supported_runtimes:
- python>=3.11
configuration:
  type: object
  properties: {}
  required: []
  additionalProperties: false
error_policy: fail_closed
audit_policy: metadata_only
runner:
  command:
  - '{python}'
  - '{plugin_root}/run.py'
  timeout_seconds: 30
  protocol: json-stdio-v2
capabilities:
- name: review.generate
  effect: internal_write
  inputs:
    type: object
    properties:
      period_start: &id001
        type: string
        minLength: 1
        maxLength: 20000
      period_end: *id001
      sources:
        type: object
        properties:
          task:
            type: object
            properties:
              planned:
                type: integer
                minimum: 0
                maximum: 1000000
              completed:
                type: integer
                minimum: 0
                maximum: 1000000
            required:
            - planned
            - completed
            additionalProperties: false
          habit:
            type: object
            properties:
              expected:
                type: integer
                minimum: 0
                maximum: 1000000
              checkins:
                type: integer
                minimum: 0
                maximum: 1000000
            required:
            - expected
            - checkins
            additionalProperties: false
          body:
            type: object
            properties:
              records:
                type: integer
                minimum: 0
                maximum: 1000000
              sleep_minutes:
                type: integer
                minimum: 0
                maximum: 1000000
              training_minutes:
                type: integer
                minimum: 0
                maximum: 1000000
            required: []
            additionalProperties: false
          finance:
            type: object
            properties:
              statements:
                type: integer
                minimum: 0
                maximum: 1000000
              income_minor:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              expense_minor:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            required: []
            additionalProperties: false
        required: []
        additionalProperties: false
      missing_sources:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 20000
        minItems: 0
        maxItems: 1000
      source_refs: &id011
        type: array
        items:
          type: object
          properties:
            provider:
              type: string
              minLength: 1
              maxLength: 20000
            kind:
              type: string
              minLength: 1
              maxLength: 20000
            id:
              type: string
              minLength: 1
              maxLength: 20000
            store_id:
              type: string
              minLength: 1
              maxLength: 20000
          required:
          - provider
          - kind
          - id
          - store_id
          additionalProperties: false
        minItems: 0
        maxItems: 1000
      finance_context:
        type: object
        properties:
          currency:
            type: string
            minLength: 1
            maxLength: 20000
          month:
            type: string
            minLength: 1
            maxLength: 20000
          unit:
            type: string
            enum:
            - minor
        required:
        - currency
        - month
        - unit
        additionalProperties: false
    required:
    - period_start
    - period_end
    - sources
    - missing_sources
    additionalProperties: false
  outputs:
    type: object
    properties:
      entity:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 20000
          kind:
            type: string
            minLength: 1
            maxLength: 20000
          version:
            type: integer
            minimum: 1
            maximum: 1000000
          created_at: &id002
            type: string
            minLength: 1
            maxLength: 20000
          updated_at: *id002
          archived: &id003
            type: boolean
          fields:
            type: object
            properties: {}
            required: []
            additionalProperties: true
        required:
        - id
        - kind
        - version
        - created_at
        - updated_at
        - archived
        - fields
        additionalProperties: false
      changed: *id003
      operation_status:
        type: string
        enum:
        - committed
      result_state:
        type: string
        enum:
        - available
        - expired
      original_request_id:
        type: string
        minLength: 1
        maxLength: 20000
      code:
        type: string
        enum:
        - result_expired
    required:
    - operation_status
    - result_state
    additionalProperties: false
  dependencies: []
  permissions:
  - review.write
  intents:
  - command
  implemented: true
  verified: true
  authorized: true
  enabled: true
  execution_mode: standalone
  description: review.generate
  resource_scopes:
    store_id: review_store
- name: review.get
  effect: read_only
  inputs:
    type: object
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 20000
    required:
    - id
    additionalProperties: false
  outputs:
    type: object
    properties:
      entity:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 20000
          kind:
            type: string
            minLength: 1
            maxLength: 20000
          version:
            type: integer
            minimum: 1
            maximum: 1000000
          created_at: &id004
            type: string
            minLength: 1
            maxLength: 20000
          updated_at: *id004
          archived:
            type: boolean
          fields:
            type: object
            properties: {}
            required: []
            additionalProperties: true
        required:
        - id
        - kind
        - version
        - created_at
        - updated_at
        - archived
        - fields
        additionalProperties: false
    required:
    - entity
    additionalProperties: false
  dependencies: []
  permissions:
  - review.read
  intents:
  - query
  implemented: true
  verified: true
  authorized: true
  enabled: true
  execution_mode: standalone
  description: review.get
  resource_scopes:
    store_id: review_store
- name: review.list
  effect: read_only
  inputs:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 100
      cursor:
        type:
        - string
        - 'null'
      include_archived:
        type: boolean
    required: []
    additionalProperties: false
  outputs:
    type: object
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 20000
            kind:
              type: string
              minLength: 1
              maxLength: 20000
            version:
              type: integer
              minimum: 1
              maximum: 1000000
            created_at: &id005
              type: string
              minLength: 1
              maxLength: 20000
            updated_at: *id005
            archived:
              type: boolean
            fields:
              type: object
              properties: {}
              required: []
              additionalProperties: true
          required:
          - id
          - kind
          - version
          - created_at
          - updated_at
          - archived
          - fields
          additionalProperties: false
        minItems: 0
        maxItems: 1000
      next_cursor:
        type:
        - string
        - 'null'
    required:
    - items
    - next_cursor
    additionalProperties: false
  dependencies: []
  permissions:
  - review.read
  intents:
  - query
  implemented: true
  verified: true
  authorized: true
  enabled: true
  execution_mode: standalone
  description: review.list
  resource_scopes:
    store_id: review_store
- name: review.finalize
  effect: internal_write
  inputs:
    type: object
    properties:
      id: &id009
        type: string
        minLength: 1
        maxLength: 20000
      expected_version: &id010
        type: integer
        minimum: 1
        maximum: 1000000
    required:
    - id
    - expected_version
    additionalProperties: false
  outputs:
    type: object
    properties:
      entity:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 20000
          kind:
            type: string
            minLength: 1
            maxLength: 20000
          version:
            type: integer
            minimum: 1
            maximum: 1000000
          created_at: &id006
            type: string
            minLength: 1
            maxLength: 20000
          updated_at: *id006
          archived: &id007
            type: boolean
          fields:
            type: object
            properties: {}
            required: []
            additionalProperties: true
        required:
        - id
        - kind
        - version
        - created_at
        - updated_at
        - archived
        - fields
        additionalProperties: false
      changed: *id007
      operation_status:
        type: string
        enum:
        - committed
      result_state:
        type: string
        enum:
        - available
        - expired
      original_request_id:
        type: string
        minLength: 1
        maxLength: 20000
      code:
        type: string
        enum:
        - result_expired
    required:
    - operation_status
    - result_state
    additionalProperties: false
  dependencies: []
  permissions:
  - review.write
  intents:
  - command
  implemented: true
  verified: true
  authorized: true
  enabled: true
  execution_mode: standalone
  description: review.finalize
  resource_scopes:
    store_id: review_store
- name: review.compare
  effect: read_only
  inputs:
    type: object
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 20000
      other_id:
        type: string
        minLength: 1
        maxLength: 20000
    required:
    - id
    - other_id
    additionalProperties: false
  outputs:
    type: object
    properties:
      left: &id008
        type: object
        properties: {}
        required: []
        additionalProperties: true
      right: *id008
      comparable:
        type: boolean
    required:
    - left
    - right
    - comparable
    additionalProperties: false
  dependencies: []
  permissions:
  - review.read
  intents:
  - query
  implemented: true
  verified: true
  authorized: true
  enabled: true
  execution_mode: standalone
  description: review.compare
  resource_scopes:
    store_id: review_store
- name: review.interpret
  effect: internal_write
  inputs:
    type: object
    properties:
      id: *id009
      expected_version: *id010
      reason:
        type: string
        minLength: 1
        maxLength: 20000
      judgement:
        type: string
        minLength: 1
        maxLength: 20000
      evidence_refs: *id011
    required:
    - id
    - expected_version
    - reason
    - judgement
    - evidence_refs
    additionalProperties: false
  outputs:
    type: object
    properties:
      entity:
        type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 20000
          kind:
            type: string
            minLength: 1
            maxLength: 20000
          version:
            type: integer
            minimum: 1
            maximum: 1000000
          created_at: &id012
            type: string
            minLength: 1
            maxLength: 20000
          updated_at: *id012
          archived: &id013
            type: boolean
          fields:
            type: object
            properties: {}
            required: []
            additionalProperties: true
        required:
        - id
        - kind
        - version
        - created_at
        - updated_at
        - archived
        - fields
        additionalProperties: false
      changed: *id013
      operation_status:
        type: string
        enum:
        - committed
      result_state:
        type: string
        enum:
        - available
        - expired
      original_request_id:
        type: string
        minLength: 1
        maxLength: 20000
      code:
        type: string
        enum:
        - result_expired
    required:
    - operation_status
    - result_state
    additionalProperties: false
  dependencies: []
  permissions:
  - review.write
  intents:
  - command
  implemented: true
  verified: true
  authorized: true
  enabled: true
  execution_mode: host_required
  description: review.interpret
  resource_scopes:
    store_id: review_store
routes: []
skill_names:
- yushuos.review
emitted_events:
- review.created
- review.finalize
- review.generate
- review.interpret
dependency_versions: {}
